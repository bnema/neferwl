[keyboard]
layout = ""
variant = ""
options = ""
repeat_rate = 25
repeat_delay = 600
cmd_key = "super"

[terminal]
command = ["foot"]

[background]
color = "#1e1e2e"

[border]
# Drawn inside the window edge; width = 0 disables it. inactive = "" draws nothing.
width = 2
active = "#b4befe"
inactive = ""

[layout]
gaps = 8
default_column_width = "1/2"
presets = ["1/3", "1/2", "2/3", "1"]

# Physical displays (drm backend). The first connected, enabled entry is used;
# without one, the first connected display that is not off. List names with
# `make tty` logs ("connector" lines) or wlr-randr.
# mode: "WxH" picks the highest refresh, "WxH@Hz" the closest; omit for preferred.
# [[output]]
# name = "DP-2"
# mode = "5120x2160@165.058"
#
# [[output]]
# name = "HDMI-A-1"
# off = true

[render]
direct_scanout = true

[log]
level = "info"
debug = []

[binds]
"Cmd+Return" = "spawn-terminal"
"Cmd+Left" = "focus-column-left"
"Cmd+Right" = "focus-column-right"
"Cmd+Up" = "focus-window-up"
"Cmd+Down" = "focus-window-down"
"Cmd+Shift+Left" = "move-column-left"
"Cmd+Shift+Right" = "move-column-right"
"Cmd+R" = "cycle-column-width"
"Cmd+Shift+F" = "toggle-fullscreen"
"Cmd+Q" = "close-window"
"Ctrl+Alt+BackSpace" = "quit"
