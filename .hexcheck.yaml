version: 1
components:
  domain: { role: core, paths: [internal/domain/**] }
  core: { role: core, paths: [internal/core/**] }
  ports: { role: ports, paths: [internal/ports/**] }
  adapters: { role: adapter, paths: [internal/adapters/**] }
  app: { role: adapter, paths: [internal/app/**] }
  entrypoints: { role: entrypoint, paths: [cmd/**, internal/cli/**] }
  generated: { role: ignore, paths: [internal/mocks/**] }
rules:
  no-adapter-imports-in-core: error
  no-infra-imports-in-usecase: error
  no-framework-types-in-core: error
  no-infra-types-in-ports: error
  missing-generated-mock-for-port: error
  no-usecase-imports-in-core: error
  no-infra-imports-in-ports: error
  no-entrypoint-imports-in-adapter: error
  suspicious-business-logic-in-adapter: warn
  no-local-fakes-for-ports: error
  prefer-generated-mocks: warn
  no-adapter-to-adapter-imports: warn
mocking:
  generatedMockPaths: [internal/mocks/**]
  generatedMockNamePatterns: ['Mock{{Interface}}', '{{Interface}}Mock']
allow:
  - rule: no-adapter-imports-in-core
    path: internal/core/layout_bench_test.go
    reason: Benchmark uses production clock to exclude mock bookkeeping from measured allocations.
  - rule: prefer-generated-mocks
    path: internal/core/layout_bench_test.go
    reason: Benchmark uses production clock to exclude mock bookkeeping from measured allocations.
  - rule: no-adapter-imports-in-core
    path: internal/core/refresh_bench_test.go
    reason: Benchmark uses production clock to exclude mock bookkeeping from measured allocations.
  - rule: prefer-generated-mocks
    path: internal/core/refresh_bench_test.go
    reason: Benchmark uses production clock to exclude mock bookkeeping from measured allocations.
  - rule: no-adapter-imports-in-core
    path: internal/core/capindicator_test.go
    reason: Production clock adapter measures allocation budgets without generated mock bookkeeping; functional timing tests use generated mocks.
  - rule: no-adapter-imports-in-core
    path: internal/core/flash_test.go
    reason: Production clock adapter measures allocation budgets without generated mock bookkeeping; functional timing tests use generated mocks.
  - rule: no-adapter-imports-in-core
    path: internal/core/outbox_test.go
    reason: Production clock adapter measures allocation budgets without generated mock bookkeeping; functional timing tests use generated mocks.
  - rule: no-adapter-imports-in-core
    path: internal/core/overview_switch_alloc_test.go
    reason: Production clock adapter measures allocation budgets without generated mock bookkeeping; functional timing tests use generated mocks.
  - rule: no-adapter-imports-in-core
    path: internal/core/publish_alloc_test.go
    reason: Production clock adapter measures allocation budgets without generated mock bookkeeping; functional timing tests use generated mocks.
  - rule: no-adapter-imports-in-core
    path: internal/core/test_dependencies_test.go
    reason: Production clock adapter measures allocation budgets without generated mock bookkeeping; functional timing tests use generated mocks.
  - rule: prefer-generated-mocks
    path: internal/core/capindicator_test.go
    reason: Production clock adapter measures allocation budgets without generated mock bookkeeping; functional timing tests use generated mocks.
  - rule: prefer-generated-mocks
    path: internal/core/flash_test.go
    reason: Production clock adapter measures allocation budgets without generated mock bookkeeping; functional timing tests use generated mocks.
  - rule: prefer-generated-mocks
    path: internal/core/outbox_test.go
    reason: Production clock adapter measures allocation budgets without generated mock bookkeeping; functional timing tests use generated mocks.
  - rule: prefer-generated-mocks
    path: internal/core/overview_switch_alloc_test.go
    reason: Production clock adapter measures allocation budgets without generated mock bookkeeping; functional timing tests use generated mocks.
  - rule: prefer-generated-mocks
    path: internal/core/publish_alloc_test.go
    reason: Production clock adapter measures allocation budgets without generated mock bookkeeping; functional timing tests use generated mocks.
  - rule: prefer-generated-mocks
    path: internal/core/test_dependencies_test.go
    reason: Production clock adapter measures allocation budgets without generated mock bookkeeping; functional timing tests use generated mocks.
  - rule: suspicious-business-logic-in-adapter
    path: internal/adapters/wayland/seat.go
    reason: Seat dispatch resolves live Wayland targets and enforces protected input delivery at the display owner.
  - rule: suspicious-business-logic-in-adapter
    path: internal/adapters/wayland/server.go
    reason: Display command dispatch validates immutable security epochs before converting port messages to wire events.
heuristics:
  # Domain value translation alone is medium confidence; require strong policy evidence.
  businessLogicMinConfidence: high
ruleSettings:
  missing-generated-mock-for-port:
    # Sealed message unions are channel data, not ports; tested by sending messages (ADR 005).
    excludePaths: [internal/ports/client_events.go, internal/ports/client_commands.go, internal/ports/input_events.go, internal/ports/output_events.go, internal/ports/lease.go, internal/ports/session_backend.go]
  no-adapter-to-adapter-imports:
    # Composition root wires concrete adapters; Makefile ADAPTER_LIBS governs adapter sharing.
    excludePaths: [internal/app/**]
