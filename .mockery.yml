# Sealed message interfaces are not mockable; channel ports are tested with messages.
all: false
formatter: goimports
force-file-write: true
structname: '{{.Mock}}{{.InterfaceName}}'
template: testify
template-schema: '{{.Template}}.schema.json'
require-template-schema-exists: true
packages:
  github.com/bnema/nefertty/internal/ports:
    config:
      dir: internal/mocks/ports
      pkgname: portsmocks
      filename: '{{.InterfaceFile | base | trimSuffix ".go"}}_mock.go'
    interfaces:
      Renderer:
      Seat:
  # Unexported adapter seams: mocks live next to the code, in test files.
  github.com/bnema/nefertty/internal/adapters/drm:
    interfaces:
      cursorPlane:
        config:
          dir: internal/adapters/drm
          pkgname: drm
          filename: cursor_plane_mock_test.go
  github.com/bnema/nefertty/internal/adapters/wayland:
    interfaces:
      procEnv:
        config:
          dir: internal/adapters/wayland
          pkgname: wayland
          filename: proc_env_mock_test.go
  github.com/bnema/nefertty/internal/adapters/statefile:
    interfaces:
      procTree:
        config:
          dir: internal/adapters/statefile
          pkgname: statefile
          filename: proc_tree_mock_test.go
