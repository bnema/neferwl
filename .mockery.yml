# Sealed message interfaces are not mockable; channel ports are tested with messages.
all: false
formatter: goimports
force-file-write: true
structname: '{{.Mock}}{{.InterfaceName}}'
template: testify
template-schema: '{{.Template}}.schema.json'
require-template-schema-exists: true
packages:
  github.com/bnema/neferwl/internal/ports:
    config:
      dir: internal/mocks/ports
      pkgname: portsmocks
      filename: '{{.InterfaceFile | base | trimSuffix ".go"}}_mock.go'
    interfaces:
      CaptureFrame:
      CastSink:
      Clock:
      ContentReturn:
      Copier:
      Notifier:
      OutputScaleStore:
      PresentationSink:
      Renderer:
      RenderDevice:
      RenderDeviceOpener:
      Seat:
      SessionSecurity:
      SessionSecurityController:
      Ticker:
      Timer:
      TokenSource:
      X11Clients:
  # Unexported adapter seams: mocks live next to the code, in test files.
  github.com/bnema/neferwl/internal/adapters/drm:
    interfaces:
      kms:
        config:
          dir: internal/adapters/drm
          pkgname: drm
          filename: kms_mock_test.go
      imageAllocator:
        config:
          dir: internal/adapters/drm
          pkgname: drm
          filename: image_allocator_mock_test.go
