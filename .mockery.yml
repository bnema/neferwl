# Sealed message interfaces are not mockable; channel ports are tested with messages.
all: false
formatter: goimports
force-file-write: true
structname: '{{.Mock}}{{.InterfaceName}}'
template: testify
template-schema: '{{.Template}}.schema.json'
require-template-schema-exists: true
packages:
  github.com/bnema/neferwl/internal/ports:
    config:
      dir: internal/mocks/ports
      pkgname: portsmocks
      filename: '{{.InterfaceFile | base | trimSuffix ".go"}}_mock.go'
    interfaces:
      Clock:
      Notifier:
      OutputScaleStore:
      Renderer:
      Seat:
      Ticker:
      Timer:
  # Unexported adapter seams: mocks live next to the code, in test files.
  github.com/bnema/neferwl/internal/adapters/drm:
    interfaces:
      kms:
        config:
          dir: internal/adapters/drm
          pkgname: drm
          filename: kms_mock_test.go
  github.com/bnema/neferwl/internal/adapters/ddc:
    interfaces:
      bus:
        config:
          dir: internal/adapters/ddc
          pkgname: ddc
          filename: bus_mock_test.go
  github.com/bnema/neferwl/internal/adapters/wayland:
    interfaces:
      procEnv:
        config:
          dir: internal/adapters/wayland
          pkgname: wayland
          filename: proc_env_mock_test.go
      syncobjDevice:
        config:
          dir: internal/adapters/wayland
          pkgname: wayland
          filename: syncobj_device_mock_test.go
  github.com/bnema/neferwl/internal/adapters/statefile:
    interfaces:
      procTree:
        config:
          dir: internal/adapters/statefile
          pkgname: statefile
          filename: proc_tree_mock_test.go
